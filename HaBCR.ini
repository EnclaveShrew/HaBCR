[Log]
; Enable logging to HaBCR.log
bEnableLog=true

; Enable verbose/debug logging (shows detailed event timing, ammo counts, etc.)
bVerboseLog=false

[General]
; Enable BCR-style compatibility mode for weapons that do not have HaBCR_LoopStart/HaBCR_LoopEnd annotations.
; When true, weapons with the "event00" annotation are handled in BCR mode.
; When false, only weapons with HaBCR_LoopStart/HaBCR_LoopEnd annotations are processed.
bBCRCompatible=true
